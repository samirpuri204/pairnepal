<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PairNepal mark — leaning pair refinements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{--crimson:#c11235;--ink:#101828;--ink3:#8896ab;--canvas:#f7f8fa;--surface:#fff}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:var(--canvas);color:var(--ink)}
  .sheet{padding:24px 28px 34px}
  h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:24px;margin:0 0 3px}
  .sub{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:20px}
  .v{background:var(--surface);border:1px solid #e7eaf0;border-radius:12px;padding:14px 16px 12px;margin-bottom:12px}
  .vhead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .vid{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--crimson)}
  .vname{font-size:13px;font-weight:600}
  .strip{display:flex;align-items:flex-end;gap:26px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .cell .px{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink3)}
  .mk{color:var(--crimson);display:block;line-height:0}
  .darkstrip{display:flex;align-items:center;gap:24px;background:#0b0d12;border-radius:9px;padding:12px 16px;margin-top:14px}
  .darkstrip .mk{color:#fff}
  .darkstrip .px{color:#7b8798}
  .lock{display:flex;align-items:center;gap:10px;margin-left:auto}
  .lock .word{font-family:'Instrument Serif',Georgia,serif;font-size:27px;line-height:1;color:#fff}
  .tile{background:var(--crimson);border-radius:22%;display:grid;place-items:center}
  .tile svg{color:#fff}
</style>
</head>
<body>
<div class="sheet">
  <h1>PairNepal — leaning-pair refinements</h1>
  <div class="sub">B1 current · B2 more separation · B3 rounder · B4 tighter</div>
  <div id="out"></div>
</div>

<script>
const V = [
  {id:'B1', name:'current',   svg:`<rect x="2.6" y="4.6" width="9.4" height="16.8" rx="2.6" transform="rotate(26 7.3 13)"/><rect x="12.0" y="4.6" width="9.4" height="16.8" rx="2.6" transform="rotate(-26 16.7 13)"/>`},
  {id:'B2', name:'more separation', svg:`<rect x="2.8" y="4.6" width="7.6" height="16.4" rx="2.6" transform="rotate(22 6.6 12.8)"/><rect x="13.6" y="4.6" width="7.6" height="16.4" rx="2.6" transform="rotate(-22 17.4 12.8)"/>`},
  {id:'B3', name:'rounder, gentler', svg:`<rect x="2.4" y="5.0" width="7.4" height="15.8" rx="3.4" transform="rotate(20 6.1 12.9)"/><rect x="14.2" y="5.0" width="7.4" height="15.8" rx="3.4" transform="rotate(-20 17.9 12.9)"/>`},
  {id:'B4', name:'tighter apex', svg:`<rect x="2.9" y="4.9" width="7.0" height="15.0" rx="2.3" transform="rotate(23 6.4 12.4)"/><rect x="14.1" y="4.9" width="7.0" height="15.0" rx="2.3" transform="rotate(-23 17.6 12.4)"/>`}
];

const out = document.getElementById('out');
for (const v of V){
  const box = document.createElement('div'); box.className='v';
  box.innerHTML = `<div class="vhead"><span class="vid">${v.id}</span><span class="vname">${v.name}</span></div>
                   <div class="strip"></div><div class="darkstrip"></div>`;
  const strip = box.querySelector('.strip');
  for (const s of [20,32,48,64,128]){
    const c=document.createElement('span'); c.className='cell';
    const h=document.createElement('span'); h.className='mk';
    h.innerHTML = `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">${v.svg}</svg>`;
    const p=document.createElement('span'); p.className='px'; p.textContent=s+'px';
    c.append(h,p); strip.append(c);
  }
  const dark = box.querySelector('.darkstrip');
  for (const s of [32,64]){
    const c=document.createElement('span'); c.className='cell';
    const h=document.createElement('span'); h.className='mk';
    h.innerHTML = `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">${v.svg}</svg>`;
    const p=document.createElement('span'); p.className='px'; p.textContent=s+'px';
    c.append(h,p); dark.append(c);
  }
  // app tile 128
  const t=document.createElement('span'); t.className='cell';
  const tile=document.createElement('span'); tile.className='tile'; tile.style.width='128px'; tile.style.height='128px';
  tile.innerHTML = `<svg width="72" height="72" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">${v.svg}</svg>`;
  const tp=document.createElement('span'); tp.className='px'; tp.textContent='tile';
  t.append(tile,tp); dark.append(t);
  // lockup
  const lock=document.createElement('div'); lock.className='lock';
  lock.innerHTML = `<span class="mk"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">${v.svg}</svg></span><span class="word">PairNepal</span>`;
  dark.append(lock);
  out.append(box);
}
</script>
</body>
</html>
