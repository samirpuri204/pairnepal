<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PairNepal mark — concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{--crimson:#c11235;--ink:#101828;--ink3:#8896ab;--canvas:#f7f8fa;--surface:#fff}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:var(--canvas);color:var(--ink)}
  .sheet{padding:26px 30px 40px}
  h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:26px;margin:0 0 3px}
  .sub{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:22px}
  .concept{background:var(--surface);border:1px solid #e7eaf0;border-radius:14px;padding:16px 18px 14px;margin-bottom:14px}
  .chead{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
  .cid{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--crimson)}
  .cname{font-size:13.5px;font-weight:600}
  .cdesc{font-size:12px;color:var(--ink3)}
  .strip{display:flex;align-items:flex-end;gap:24px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:7px}
  .cell .px{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink3)}
  .mk{color:var(--crimson);display:block;line-height:0}
  .darkstrip{display:flex;align-items:center;gap:26px;background:#0b0d12;border-radius:10px;padding:14px 18px;margin-top:16px}
  .darkstrip .mk{color:#fff}
  .darkstrip .px{color:#7b8798}
  .lock{display:flex;align-items:center;gap:11px;margin-left:auto}
  .lock .word{font-family:'Instrument Serif',Georgia,serif;font-size:32px;line-height:1;color:var(--ink)}
  .darkstrip .lock .word{color:#fff}
</style>
</head>
<body>
<div class="sheet">
  <h1>PairNepal — mark concepts</h1>
  <div class="sub">A twin summits · B leaning pair · C channelled peak · D facing arrows · E paired wedge</div>
  <div id="out"></div>
</div>

<script>
const CONCEPTS = [
  {
    id:'A', name:'Twin summits',
    desc:'A two-summit range. Clean, but reads as a generic mountain icon.',
    svg:`<path d="M1.2 20 H13.6 L7.4 5.2 Z"/><path d="M10.4 20 H22.8 L16.6 8.6 Z"/>`
  },
  {
    id:'B', name:'Leaning pair',
    desc:'Two rounded units leaning together into a summit — pairing as the peak.',
    svg:`<rect x="2.6" y="4.6" width="9.4" height="16.8" rx="2.6" transform="rotate(26 7.3 13)"/>
         <rect x="12.0" y="4.6" width="9.4" height="16.8" rx="2.6" transform="rotate(-26 16.7 13)"/>`
  },
  {
    id:'C', name:'Channelled peak',
    desc:'One peak with a horizontal channel cut through it — the transfer path.',
    svg:`<path d="M7.2 11.1 L12 4.2 L16.8 11.1 Z"/>
         <path d="M4.7 14.7 L19.3 14.7 L23.0 19.8 L1.0 19.8 Z"/>`
  },
  {
    id:'D', name:'Facing arrows',
    desc:'Two arrows aimed at each other with a packet between — send and receive.',
    svg:`<path d="M8.6 4.4 L1.8 12 L8.6 19.6" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
         <path d="M15.4 4.4 L22.2 12 L15.4 19.6" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
         <circle cx="12" cy="12" r="2.3"/>`
  },
  {
    id:'E', name:'Paired wedge',
    desc:'Two wedges interlocking into a peak; the seam is the pairing.',
    svg:`<path d="M11.2 4.4 L2.0 19.8 H12.6 Z"/><path d="M12.8 8.4 L22.0 19.8 H11.4 Z"/>`
  }
];

const SIZES = [20, 32, 64, 128];
const out = document.getElementById('out');

for (const c of CONCEPTS){
  const box = document.createElement('div');
  box.className = 'concept';
  box.innerHTML = `
    <div class="chead"><span class="cid">${c.id}</span><span class="cname">${c.name}</span><span class="cdesc">${c.desc}</span></div>
    <div class="strip"></div>
    <div class="darkstrip"></div>`;
  const strip = box.querySelector('.strip');
  const dark = box.querySelector('.darkstrip');

  for (const s of SIZES){
    const cell = document.createElement('span'); cell.className='cell';
    const holder = document.createElement('span'); holder.className='mk';
    holder.innerHTML = `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">${c.svg}</svg>`;
    const px = document.createElement('span'); px.className='px'; px.textContent = s+'px';
    cell.append(holder, px); strip.append(cell);
  }
  // dark strip at working sizes
  for (const s of [32, 64]){
    const cell = document.createElement('span'); cell.className='cell';
    const holder = document.createElement('span'); holder.className='mk';
    holder.innerHTML = `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">${c.svg}</svg>`;
    const px = document.createElement('span'); px.className='px'; px.textContent = s+'px';
    cell.append(holder, px); dark.append(cell);
  }
  const lock = document.createElement('div'); lock.className='lock';
  lock.innerHTML = `<span class="mk"><svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">${c.svg}</svg></span><span class="word">PairNepal</span>`;
  dark.append(lock);

  out.append(box);
}
</script>
</body>
</html>
